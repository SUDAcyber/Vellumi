# Vellumi 0.6 (Tauri, next/): builds and tests on macOS, Windows and Linux.
# The fidelity and UI self-tests drive the real app in hidden windows; on
# Linux they run under a virtual display. Nothing here publishes anything.
name: next

on:
  push:
    paths: ["next/**", ".github/workflows/next.yml"]
  pull_request:
    paths: ["next/**", ".github/workflows/next.yml"]
  workflow_dispatch:

concurrency:
  group: next-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: next
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: next

      - name: Linux system libraries (WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libayatana-appindicator3-dev patchelf xvfb

      - name: Install JavaScript dependencies
        run: |
          npm ci --prefix packages/editor
          npm ci

      - name: Rust tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: JavaScript tests
        run: node --test packages/editor/test/*.test.mjs

      - name: Type check
        run: cd apps/desktop && npx svelte-check --tsconfig ./tsconfig.json --threshold error

      - name: Build the app (no installer)
        run: |
          npm run build -w apps/desktop
          cd apps/desktop && npx tauri build --debug --no-bundle

      - name: Markdown fidelity + UI self-test (macOS)
        if: runner.os == 'macOS'
        run: |
          scripts/fidelity.sh
          scripts/selftest.sh

      - name: Markdown fidelity + UI self-test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a scripts/fidelity.sh
          xvfb-run -a scripts/selftest.sh
