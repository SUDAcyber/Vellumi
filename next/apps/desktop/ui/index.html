<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vellumi</title>
    <!-- Editor theme pair, swapped by moltenAPI.setTheme (built by
         packages/editor/build-themes.mjs into ui/public/themes). -->
    <link id="theme-light" rel="stylesheet" href="themes/frame-light.css" media="(prefers-color-scheme: light)" />
    <link id="theme-dark" rel="stylesheet" href="themes/frame-dark.css" media="(prefers-color-scheme: dark)" />
    <script>
      // VoiceOver picks its voice from <html lang>.
      document.documentElement.lang =
        (typeof window.__vellumiLanguage === "string" && window.__vellumiLanguage) || navigator.language || "en";
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
